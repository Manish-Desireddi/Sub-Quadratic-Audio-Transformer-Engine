name: Automated Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  test:
    name: Run Python and C++ Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools scikit-build-core pybind11 numpy scipy psutil torch pytest transformers websockets

      - name: Build and Run C++ Tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cd build && ctest --output-on-failure

      - name: Build and Install Python Package
        run: |
          pip install -e .

      - name: Run Full Python Test Suite
        run: |
          python -m pytest tests/ -v --ignore=tests/test_quadratic.py

      - name: Run Python Benchmarks/Tests
        run: |
          python tests/download_audio.py && python tests/benchmark_audio.py
