[build-system]
requires = ["setuptools>=42", "wheel", "cmake>=3.15", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subq_audio"
version = "0.1.0"
description = "A Bare-Metal, Lock-Free O(N) Attention Engine for Infinite Continuous Audio Streaming"
authors = [
    { name="Manish-Desireddi", email="manishdesireddi@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch"
]
